<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; text-align: center;
    background: #1f2a5c; color: #e8ecfa;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .play { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.18);
    display: grid; place-items: center; margin: 0 auto 10px; }
  .play::after { content: ""; border-left: 14px solid #fff; border-top: 9px solid transparent;
    border-bottom: 9px solid transparent; margin-left: 4px; }
  small { opacity: .75; }
</style>
</head>
<body>
  <div><div class="play"></div>Customer video<br><small>Plays on the live Skydo site</small></div>
</body>
</html>
